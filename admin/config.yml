backend:
  name: github
  repo: samkomane008/ds-attorneys
  branch: main
  # OAuth proxy that lets the login button work on GitHub Pages.
  # Replace the placeholder below with the Cloudflare Worker URL from the setup steps
  # (samloryx-os handoff: ds-attorneys-cms-setup.md). Until then, login will not complete.
  base_url: https://REPLACE-WITH-OAUTH-WORKER-URL

# Where uploaded images are stored in the repo, and how the site refers to them.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# A friendly editing experience: writers see a live preview and never touch code.
site_url: https://attds.co.za
display_url: https://attds.co.za
publish_mode: simple

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    description: "Write and publish an article. It appears under Insights on the website."
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "insights/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "DS Attorneys" }
      - { label: "Short summary (shown on the Insights list)", name: "summary", widget: "text" }
      - { label: "Article body", name: "body", widget: "markdown" }

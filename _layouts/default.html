<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | DS Attorneys{% else %}Insights | DS Attorneys{% endif %}</title>
<meta name="description" content="{% if page.summary %}{{ page.summary }}{% else %}Commercial law insights from DS Attorneys, Pretoria.{% endif %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12100d; --ink-raised: #1c1915;
    --paper: #f1eee7; --paper-raised: #faf8f3;
    --gold: #b08d57; --gold-bright: #c9a76b;
    --text-dark-bg: #a8a199; --text-paper-bg: #4a453e;
    --heading-paper-bg: #191611;
    --hairline-dark: rgba(176, 141, 87, 0.35);
    --hairline-paper: rgba(25, 22, 17, 0.16);
    --serif: "Playfair Display", Didot, "Bodoni MT", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); font-weight: 300; background: var(--paper); color: var(--text-paper-bg); font-size: 1.06rem; line-height: 1.7; }
  ::selection { background: var(--gold); color: var(--ink); }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }
  a { color: var(--gold); }

  nav { position: sticky; top: 0; z-index: 50; background: rgba(18, 16, 13, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hairline-dark); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; max-width: 1060px; margin: 0 auto; }
  .brand { display: flex; align-items: baseline; gap: 14px; text-decoration: none; }
  .monogram { font-family: var(--serif); font-size: 1.7rem; line-height: 1; }
  .monogram .d { color: #fff; } .monogram .s { color: var(--gold); }
  .brand-name { font-family: var(--sans); font-weight: 400; letter-spacing: 0.26em; font-size: 0.82rem; color: #fff; text-transform: uppercase; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: var(--text-dark-bg); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 400; transition: color 0.2s; }
  .nav-links a:hover { color: var(--gold-bright); }
  .nav-toggle { display: none; background: none; border: 0; cursor: pointer; width: 44px; height: 44px; padding: 10px; align-items: center; justify-content: center; }
  .nav-toggle span { display: block; position: relative; width: 24px; height: 2px; background: #fff; }
  .nav-toggle span::before, .nav-toggle span::after { content: ""; position: absolute; left: 0; width: 24px; height: 2px; background: #fff; transition: transform 0.25s; }
  .nav-toggle span::before { top: -7px; } .nav-toggle span::after { top: 7px; }
  .nav-toggle[aria-expanded="true"] span { background: transparent; }
  .nav-toggle[aria-expanded="true"] span::before { transform: translateY(7px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span::after { transform: translateY(-7px) rotate(-45deg); }
  @media (max-width: 720px) {
    .nav-toggle { display: flex; }
    .nav-links { position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0; background: rgba(18, 16, 13, 0.98); border-bottom: 1px solid var(--hairline-dark); padding: 8px 0; display: none; }
    .nav-links.open { display: flex; }
    .nav-links a { padding: 15px 24px; border-top: 1px solid var(--hairline-dark); font-size: 0.85rem; }
    .nav-links a:first-child { border-top: 0; }
  }

  main { min-height: 60vh; padding: 64px 0 80px; }
  .eyebrow { font-family: var(--sans); font-weight: 400; font-size: 0.78rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .eyebrow::before { content: ""; width: 34px; height: 1px; background: var(--gold); }
  h1, h2, h3 { font-family: var(--serif); font-weight: 500; color: var(--heading-paper-bg); text-wrap: balance; line-height: 1.2; }

  footer { background: var(--ink); border-top: 1px solid var(--hairline-dark); padding: 34px 0 42px; font-size: 0.85rem; color: var(--text-dark-bg); }
  .footer-inner { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; max-width: 1060px; margin: 0 auto; padding: 0 24px; }

  .wa-float { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; background: #25d366; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 60; }
  .wa-float svg { width: 32px; height: 32px; fill: #fff; }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="DS Attorneys home">
      <span class="monogram"><span class="d">D</span><span class="s">S</span></span>
      <span class="brand-name">Attorneys</span>
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links"><span></span></button>
    <div class="nav-links" id="nav-links">
      <a href="/#about">About</a>
      <a href="/#services">Services</a>
      <a href="/insights/">Insights</a>
      <a href="/#contact">Contact</a>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    {{ content }}
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>© 2026 DS Attorneys. All rights reserved.</span>
    <span>Lombardy Meander, Shere, Pretoria, 0081</span>
  </div>
</footer>

<a class="wa-float" href="https://wa.me/27718904236" target="_blank" rel="noopener" aria-label="Chat to DS Attorneys on WhatsApp">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.004 3.2c-7.06 0-12.8 5.74-12.8 12.8 0 2.26.59 4.46 1.71 6.4L3.2 28.8l6.58-1.67a12.74 12.74 0 0 0 6.22 1.61h.01c7.06 0 12.79-5.74 12.79-12.8 0-3.42-1.33-6.63-3.75-9.05a12.72 12.72 0 0 0-9.05-3.69zm0 23.36h-.01a10.6 10.6 0 0 1-5.4-1.48l-.39-.23-3.9.99 1.04-3.8-.25-.39a10.56 10.56 0 0 1-1.62-5.65c0-5.87 4.78-10.64 10.65-10.64 2.84 0 5.51 1.11 7.52 3.12a10.57 10.57 0 0 1 3.11 7.53c0 5.87-4.78 10.55-10.75 10.55zm5.83-7.96c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.5-.16-.72.16-.21.32-.82 1.04-1.01 1.25-.18.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.59-.95-.85-1.59-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.72-1.73-.98-2.37-.26-.62-.52-.54-.72-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.12 1.09-1.12 2.66 0 1.57 1.14 3.08 1.3 3.29.16.21 2.25 3.43 5.45 4.81.76.33 1.36.53 1.82.68.77.24 1.46.21 2.01.13.61-.09 1.89-.77 2.16-1.52.27-.75.27-1.39.19-1.52-.08-.13-.29-.21-.61-.37z"/></svg>
</a>

<script>
  (function () {
    var btn = document.querySelector('.nav-toggle');
    var links = document.getElementById('nav-links');
    if (!btn || !links) return;
    btn.addEventListener('click', function () {
      var open = links.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
</body>
</html>

# Validate Jekyll source before any client-facing Cloudflare release.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-attorneys-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: website-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install pinned-major Jekyll
        run: gem install jekyll -v "~> 4.3" --no-document
      - name: Build and verify the actual static site
        run: |
          set -euo pipefail
          jekyll build --destination _site
          test -s _site/index.html
          test -s _site/insights.html || test -s _site/insights/index.html

# Deploy the exact successful main CI commit, never directly from a PR.
name: Deploy to Cloudflare

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ds-attorneys-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ds-attorneys-production
      url: https://attds.co.za

    steps:
      - name: Confirm verified SHA is still current main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$SHA" ]] || {
            echo "::error::A newer main commit exists; its own CI must pass first"; exit 1;
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check that Cloudflare deployment credentials exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CF_TOKEN" ]] || { echo "::error::Set CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [[ -n "$CF_ACCOUNT" ]] || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }

      - name: Build the validated Jekyll content
        run: |
          set -euo pipefail
          gem install jekyll -v "~> 4.3" --no-document
          jekyll build --destination _site
          test -s _site/index.html

      - name: Confirm main is still the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$SHA" ]] || {
            echo "::error::Main advanced before Cloudflare deploy"; exit 1;
          }

      - name: Publish the static site via Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Verify the public HTTPS endpoint responds
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 3 --fail --silent --show-error --max-time 20 \
            -o /dev/null https://attds.co.za/
          echo "::notice::DS Attorneys Cloudflare deployment accepted for ${{ github.event.workflow_run.head_sha }}."
